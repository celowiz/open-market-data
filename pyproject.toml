[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-market-data"
version = "0.1.0"
description = "Open-source platform for collecting and publishing public financial market data"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Open Market Data contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.115",
  "httpx>=0.27",
  "polars>=1.0",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.32",
  "structlog>=24.4",
  "tenacity>=9.0",
  "typer>=0.12",
  "uvicorn>=0.30",
  "psycopg[binary]>=3.2",
  "python-bcb>=0.4.0",
  "yfinance>=1.6.0",
]

[project.scripts]
marketdata = "marketdata.cli.main:app"

[project.urls]
Homepage = "https://github.com/celowiz/open-market-data"
Documentation = "https://github.com/celowiz/open-market-data/tree/main/docs"

[dependency-groups]
dev = [
  "pyright>=1.1",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/marketdata"]

[tool.hatch.build.targets.wheel.sources]
"src/marketdata" = "marketdata"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "db: tests that require DATABASE_URL / PostgreSQL",
  "integration: tests that call live external data sources",
]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs", "migrations/script.py.mako", ".cursor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/marketdata/api/**" = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
