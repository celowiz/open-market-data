# Yahoo Finance EOD — unofficial POC (ADR-0013). Public dataset stays off.
# Nightly at 00:00 America/Sao_Paulo (UTC-3). Scratch equities as {TICKER}.SA.
# Official ingest/backfill workflows keep YAHOO_PROVIDER_ENABLED=false.
name: Ingest Yahoo

on:
  schedule:
    # 00:00 America/Sao_Paulo (UTC-3). Brazil has not used DST since 2019.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Reference date YYYY-MM-DD (defaults to yesterday America/Sao_Paulo)"
        required: false

# Shared with backfill and other ingest workflows so only one Neon writer runs at a time.
concurrency:
  group: neon-writes
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: production
      APP_TIMEZONE: America/Sao_Paulo
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OBJECT_STORAGE_BACKEND: ${{ vars.OBJECT_STORAGE_BACKEND || 'local' }}
      LOCAL_STORAGE_PATH: ${{ vars.LOCAL_STORAGE_PATH || './data' }}
      OBJECT_STORAGE_ENDPOINT: ${{ vars.OBJECT_STORAGE_ENDPOINT }}
      OBJECT_STORAGE_BUCKET: ${{ vars.OBJECT_STORAGE_BUCKET }}
      OBJECT_STORAGE_ACCESS_KEY: ${{ secrets.OBJECT_STORAGE_ACCESS_KEY }}
      OBJECT_STORAGE_SECRET_KEY: ${{ secrets.OBJECT_STORAGE_SECRET_KEY }}
      OBJECT_STORAGE_REGION: ${{ vars.OBJECT_STORAGE_REGION || 'auto' }}
      INGEST_UNIVERSE: ${{ vars.INGEST_UNIVERSE }}
      B3_EQUITY_UNIVERSE_PATH: ${{ vars.B3_EQUITY_UNIVERSE_PATH }}
      YAHOO_PROVIDER_ENABLED: "true"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Require DATABASE_URL
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL secret is not set. Refusing to ingest — results would not be persisted to PostgreSQL."
            exit 1
          fi

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Resolve reference date
        id: refdate
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_DATE:-}" ]; then
            printf 'date=%s\n' "$INPUT_DATE" >> "$GITHUB_OUTPUT"
            echo "Yahoo --date from workflow_dispatch: $INPUT_DATE"
            exit 0
          fi
          # Yesterday America/Sao_Paulo — completed session, not an in-progress bar.
          DATE="$(uv run python -c 'from marketdata.ingestion.schedule import yahoo_ingest_reference_date; print(yahoo_ingest_reference_date().isoformat())')"
          printf 'date=%s\n' "$DATE" >> "$GITHUB_OUTPUT"
          echo "Yahoo --date from yahoo_ingest_reference_date: $DATE"

      - name: Ingest Yahoo
        run: uv run marketdata ingest yahoo --date "${{ steps.refdate.outputs.date }}"
