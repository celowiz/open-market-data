# B3 securities lending (BTC) — after B3 EOD, 21:30 America/Sao_Paulo weekdays.
# UTC: 30 0 * * 2-6 (Tue–Sat 00:30 UTC = Mon–Fri 21:30 BRT). See docs/INGEST_SCHEDULE.md.
#
# Aggregated registered loans + open position for INGEST_UNIVERSE=scratch only.
# NEGOCIOSBTB tape is not written to Neon.
name: Ingest B3 lending

on:
  schedule:
    - cron: "30 0 * * 2-6"
  workflow_dispatch:
    inputs:
      date:
        description: "Reference date YYYY-MM-DD (empty = B3 trading date from schedule helper)"
        required: false

concurrency:
  group: neon-writes
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_ENV: production
      APP_TIMEZONE: America/Sao_Paulo
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OBJECT_STORAGE_BACKEND: ${{ vars.OBJECT_STORAGE_BACKEND || 'local' }}
      LOCAL_STORAGE_PATH: ${{ vars.LOCAL_STORAGE_PATH || './data' }}
      OBJECT_STORAGE_ENDPOINT: ${{ vars.OBJECT_STORAGE_ENDPOINT }}
      OBJECT_STORAGE_BUCKET: ${{ vars.OBJECT_STORAGE_BUCKET }}
      OBJECT_STORAGE_ACCESS_KEY: ${{ secrets.OBJECT_STORAGE_ACCESS_KEY }}
      OBJECT_STORAGE_SECRET_KEY: ${{ secrets.OBJECT_STORAGE_SECRET_KEY }}
      OBJECT_STORAGE_REGION: ${{ vars.OBJECT_STORAGE_REGION || 'auto' }}
      INGEST_UNIVERSE: ${{ vars.INGEST_UNIVERSE }}
      B3_EQUITY_UNIVERSE_PATH: ${{ vars.B3_EQUITY_UNIVERSE_PATH }}
      B3_PROVIDER_ENABLED: ${{ vars.B3_PROVIDER_ENABLED || 'true' }}
      YAHOO_PROVIDER_ENABLED: "false"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Require DATABASE_URL
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL secret is not set. Refusing to ingest — results would not be persisted to PostgreSQL."
            exit 1
          fi

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Resolve B3 trading date
        id: refdate
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_DATE:-}" ]; then
            printf 'date=%s\n' "$INPUT_DATE" >> "$GITHUB_OUTPUT"
            echo "B3 lending --date from workflow_dispatch: $INPUT_DATE"
            exit 0
          fi
          DATE="$(uv run python -m marketdata.ingestion.schedule)"
          printf 'date=%s\n' "$DATE" >> "$GITHUB_OUTPUT"
          echo "B3 lending --date from marketdata.ingestion.schedule: $DATE"

      - name: Ingest B3 lending
        run: uv run marketdata ingest b3-lending --date "${{ steps.refdate.outputs.date }}"
