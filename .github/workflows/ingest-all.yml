# Combined ingest — workflow_dispatch only. No daily cron.
#
# Official daily path is the per-provider crons (BCB, B3, Tesouro).
# Do not enable a schedule here together with those crons — that double-ingests.
# Keep this workflow for operator one-shot runs.
# CLI: marketdata ingest all --date
# See docs/INGEST_SCHEDULE.md.
name: Ingest all

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Reference date YYYY-MM-DD (defaults to today UTC)"
        required: false

concurrency:
  group: ingest-all
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      APP_ENV: production
      APP_TIMEZONE: America/Sao_Paulo
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CVM_CLASSES: ${{ vars.CVM_CLASSES || 'Multimercado,Ações' }}
      OBJECT_STORAGE_BACKEND: ${{ vars.OBJECT_STORAGE_BACKEND || 'local' }}
      LOCAL_STORAGE_PATH: ${{ vars.LOCAL_STORAGE_PATH || './data' }}
      OBJECT_STORAGE_ENDPOINT: ${{ vars.OBJECT_STORAGE_ENDPOINT }}
      OBJECT_STORAGE_BUCKET: ${{ vars.OBJECT_STORAGE_BUCKET }}
      OBJECT_STORAGE_ACCESS_KEY: ${{ secrets.OBJECT_STORAGE_ACCESS_KEY }}
      OBJECT_STORAGE_SECRET_KEY: ${{ secrets.OBJECT_STORAGE_SECRET_KEY }}
      OBJECT_STORAGE_REGION: ${{ vars.OBJECT_STORAGE_REGION || 'auto' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Require DATABASE_URL
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL secret is not set. Refusing to ingest — results would not be persisted to PostgreSQL."
            exit 1
          fi

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Resolve reference date
        id: refdate
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_DATE:-}" ]; then
            printf 'date=%s\n' "$INPUT_DATE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Cron is 00:30 UTC (21:30 BRT). Use America/Sao_Paulo's calendar date,
          # not UTC (which has already rolled forward).
          DATE="$(python3 <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo

          print(datetime.now(ZoneInfo("America/Sao_Paulo")).date().isoformat())
          PY
          )"
          printf 'date=%s\n' "$DATE" >> "$GITHUB_OUTPUT"

      - name: Ingest all
        run: uv run marketdata ingest all --date "${{ steps.refdate.outputs.date }}"
