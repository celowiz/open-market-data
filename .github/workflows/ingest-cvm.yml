# CVM Informe Diário — workflow_dispatch only. No daily cron.
#
# Persist is filtered by CVM_CLASSES (default Multimercado,Ações). Keep this
# workflow for operator reruns. DATABASE_URL is an Actions secret (no value
# in git). See docs/INGEST_SCHEDULE.md.
name: Ingest CVM

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Reference date YYYY-MM-DD (defaults to today UTC)"
        required: false

# Shared with backfill and other ingest workflows so only one Neon writer runs at a time.
concurrency:
  group: neon-writes
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      APP_ENV: production
      APP_TIMEZONE: America/Sao_Paulo
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CVM_CLASSES: ${{ vars.CVM_CLASSES || 'Multimercado,Ações' }}
      OBJECT_STORAGE_BACKEND: ${{ vars.OBJECT_STORAGE_BACKEND || 'local' }}
      LOCAL_STORAGE_PATH: ${{ vars.LOCAL_STORAGE_PATH || './data' }}
      OBJECT_STORAGE_ENDPOINT: ${{ vars.OBJECT_STORAGE_ENDPOINT }}
      OBJECT_STORAGE_BUCKET: ${{ vars.OBJECT_STORAGE_BUCKET }}
      OBJECT_STORAGE_ACCESS_KEY: ${{ secrets.OBJECT_STORAGE_ACCESS_KEY }}
      OBJECT_STORAGE_SECRET_KEY: ${{ secrets.OBJECT_STORAGE_SECRET_KEY }}
      OBJECT_STORAGE_REGION: ${{ vars.OBJECT_STORAGE_REGION || 'auto' }}
      YAHOO_PROVIDER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Require DATABASE_URL
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL secret is not set. Refusing to ingest — results would not be persisted to PostgreSQL."
            exit 1
          fi

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Resolve reference date
        id: refdate
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_DATE:-}" ]; then
            printf 'date=%s\n' "$INPUT_DATE" >> "$GITHUB_OUTPUT"
          else
            printf 'date=%s\n' "$(date -u +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: Ingest CVM
        run: uv run marketdata ingest cvm --date "${{ steps.refdate.outputs.date }}"
