# Historical range ingest. NEVER add a schedule / daily cron (ADR-0006, Phase 12).
# Operators dispatch this workflow with an explicit start/end. Long CVM HIST
# windows may exceed the GitHub-hosted 6-hour cap — run those locally.
name: Backfill

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider to backfill"
        required: true
        type: choice
        options:
          - tesouro
          - bcb
          - cvm
          - b3
          - yahoo
          - all
      start:
        description: "Start date YYYY-MM-DD"
        required: true
      end:
        description: "End date YYYY-MM-DD"
        required: true

# Shared with ingest-* so only one Neon writer runs at a time.
concurrency:
  group: neon-writes
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      APP_ENV: production
      APP_TIMEZONE: America/Sao_Paulo
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CVM_CLASSES: ${{ vars.CVM_CLASSES || 'Multimercado,Ações' }}
      OBJECT_STORAGE_BACKEND: ${{ vars.OBJECT_STORAGE_BACKEND || 'local' }}
      LOCAL_STORAGE_PATH: ${{ vars.LOCAL_STORAGE_PATH || './data' }}
      OBJECT_STORAGE_ENDPOINT: ${{ vars.OBJECT_STORAGE_ENDPOINT }}
      OBJECT_STORAGE_BUCKET: ${{ vars.OBJECT_STORAGE_BUCKET }}
      OBJECT_STORAGE_ACCESS_KEY: ${{ secrets.OBJECT_STORAGE_ACCESS_KEY }}
      OBJECT_STORAGE_SECRET_KEY: ${{ secrets.OBJECT_STORAGE_SECRET_KEY }}
      OBJECT_STORAGE_REGION: ${{ vars.OBJECT_STORAGE_REGION || 'auto' }}
      INGEST_UNIVERSE: ${{ vars.INGEST_UNIVERSE }}
      B3_EQUITY_UNIVERSE_PATH: ${{ vars.B3_EQUITY_UNIVERSE_PATH }}
      YAHOO_PROVIDER_ENABLED: "false"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Require DATABASE_URL
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL secret is not set. Refusing to backfill — results would not be persisted to PostgreSQL."
            exit 1
          fi

      - name: Validate inputs
        env:
          PROVIDER: ${{ inputs.provider }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: |
          set -euo pipefail
          case "$PROVIDER" in
            tesouro|bcb|cvm|b3|yahoo|all) ;;
            *)
              echo "::error::Unsupported provider: $PROVIDER"
              exit 1
              ;;
          esac
          if ! printf '%s' "$START" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::start must be YYYY-MM-DD"
            exit 1
          fi
          if ! printf '%s' "$END" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::end must be YYYY-MM-DD"
            exit 1
          fi

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      # Runner ./data is ephemeral. Cache/artifact restore is best-effort: a hard
      # 6h timeout can skip post steps. The CLI also resumes from
      # max(instrument_quotes.reference_date) (or series observations for BCB).
      - name: Ensure checkpoint directory
        run: mkdir -p data/state/backfill

      - name: Restore backfill checkpoint cache
        uses: actions/cache/restore@v4
        with:
          path: data/state/backfill
          key: backfill-${{ inputs.provider }}-${{ inputs.start }}-${{ inputs.end }}-${{ github.run_id }}
          restore-keys: |
            backfill-${{ inputs.provider }}-${{ inputs.start }}-${{ inputs.end }}-

      - name: Restore backfill checkpoint artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDER: ${{ inputs.provider }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p data/state/backfill
          NAME="backfill-checkpoint-${PROVIDER}-${START}-${END}"
          ARTIFACT_ID="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${NAME}&per_page=1" \
            --jq '.artifacts[0].id // empty' || true)"
          if [ -z "${ARTIFACT_ID}" ]; then
            echo "No previous checkpoint artifact named ${NAME}"
            exit 0
          fi
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > /tmp/backfill-checkpoint.zip
          unzip -o -q /tmp/backfill-checkpoint.zip -d data/state/backfill
          echo "Restored checkpoint artifact id=${ARTIFACT_ID}"

      - name: Backfill
        env:
          PROVIDER: ${{ inputs.provider }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: uv run marketdata backfill "$PROVIDER" --start "$START" --end "$END"

      - name: Save backfill checkpoint cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: data/state/backfill
          key: backfill-${{ inputs.provider }}-${{ inputs.start }}-${{ inputs.end }}-${{ github.run_id }}

      - name: Upload backfill checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-checkpoint-${{ inputs.provider }}-${{ inputs.start }}-${{ inputs.end }}
          path: data/state/backfill/
          if-no-files-found: ignore
          retention-days: 30
