# Historical range ingest. NEVER add a schedule / daily cron (ADR-0006, Phase 12).
# Operators dispatch this workflow with an explicit start/end. Long CVM HIST
# windows may exceed the GitHub-hosted 6-hour cap — run those locally.
name: Backfill

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider to backfill"
        required: true
        type: choice
        options:
          - tesouro
          - bcb
          - cvm
          - b3
          - yahoo
          - all
      start:
        description: "Start date YYYY-MM-DD"
        required: true
      end:
        description: "End date YYYY-MM-DD"
        required: true

concurrency:
  group: backfill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      APP_ENV: production
      APP_TIMEZONE: America/Sao_Paulo
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OBJECT_STORAGE_BACKEND: ${{ vars.OBJECT_STORAGE_BACKEND || 'local' }}
      LOCAL_STORAGE_PATH: ${{ vars.LOCAL_STORAGE_PATH || './data' }}
      OBJECT_STORAGE_ENDPOINT: ${{ vars.OBJECT_STORAGE_ENDPOINT }}
      OBJECT_STORAGE_BUCKET: ${{ vars.OBJECT_STORAGE_BUCKET }}
      OBJECT_STORAGE_ACCESS_KEY: ${{ secrets.OBJECT_STORAGE_ACCESS_KEY }}
      OBJECT_STORAGE_SECRET_KEY: ${{ secrets.OBJECT_STORAGE_SECRET_KEY }}
      OBJECT_STORAGE_REGION: ${{ vars.OBJECT_STORAGE_REGION || 'auto' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Require DATABASE_URL
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL secret is not set. Refusing to backfill — results would not be persisted to PostgreSQL."
            exit 1
          fi

      - name: Validate inputs
        env:
          PROVIDER: ${{ inputs.provider }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: |
          set -euo pipefail
          case "$PROVIDER" in
            tesouro|bcb|cvm|b3|yahoo|all) ;;
            *)
              echo "::error::Unsupported provider: $PROVIDER"
              exit 1
              ;;
          esac
          if ! printf '%s' "$START" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::start must be YYYY-MM-DD"
            exit 1
          fi
          if ! printf '%s' "$END" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::end must be YYYY-MM-DD"
            exit 1
          fi

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Backfill
        env:
          PROVIDER: ${{ inputs.provider }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: uv run marketdata backfill "$PROVIDER" --start "$START" --end "$END"
